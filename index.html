<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeSetu - B2B Trade OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 sm:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-black text-blue-400">TradeSetu</h1>
            <span class="bg-emerald-500/10 text-emerald-400 text-xs px-3 py-1 rounded-full font-medium">GSTIN Verified</span>
        </header>

        <section class="bg-slate-900 border border-slate-800 rounded-xl p-6">
            <h2 class="text-xl font-bold text-white mb-1">Manufacturer & Wholesaler Registration</h2>
            <p class="text-xs text-slate-400 mb-6">Register your business to access verified buyer RFQs and trade network.</p>

            <form name="seller-onboarding" method="POST" data-netlify="true" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <input type="hidden" name="form-name" value="seller-onboarding" />
                <div>
                    <label class="block text-xs uppercase text-slate-300 font-semibold mb-1">Business Name *</label>
                    <input type="text" name="company" required placeholder="Apex Textiles" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-300 font-semibold mb-1">GSTIN Number *</label>
                    <input type="text" name="gstin" required placeholder="24AAAAA0000A1Z5" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 uppercase">
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-300 font-semibold mb-1">WhatsApp Number *</label>
                    <input type="tel" name="whatsapp" required placeholder="+91 9876543210" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-300 font-semibold mb-1">City / Industrial Hub *</label>
                    <input type="text" name="city" required placeholder="Surat / Ahmedabad" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div class="sm:col-span-2">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded text-sm shadow-lg shadow-blue-600/30">Submit Business Verification</button>
                </div>
            </form>
        </section>
    </div>
</body>
</html>
